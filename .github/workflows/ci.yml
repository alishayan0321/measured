name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-tests:
    name: web tests (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: recommend
        run: node test/recommend.test.cjs
      - name: shelf
        run: node test/shelf.test.cjs
      - name: wire
        run: node test/wire.test.cjs
      - name: repeat
        run: node test/repeat.test.cjs
      - name: embed
        run: node test/embed.test.cjs
      - name: parse
        # test/parse-vectors.json is the contract shared with rust/core/src/scan.rs.
        # The rust job runs the same file from cargo test, so a divergence between
        # the two parsers fails whichever side drifted.
        run: node test/parse.test.cjs
      - name: stage
        # Both packaged builds have shipped a 404 (styles/ on Android,
        # embeddings.json on both), so the bundles are checked against the
        # page's own references rather than against the staging lists.
        run: node test/stage.test.cjs

  rust-lint:
    name: rust lint
    # Blocking: the tree is rustfmt-clean, so a red lint job means a real
    # regression rather than pre-existing debt.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: fmt
        run: cargo fmt --all --check

  rust-core:
    name: rust core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: clippy
        run: cargo clippy -p measured-core --all-targets -- -D warnings
      - name: test
        run: cargo test -p measured-core

  rust-desktop:
    name: rust desktop (windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: stub yt-dlp
        # yt-dlp.exe is gitignored but listed in bundle.resources, so the Tauri
        # build script refuses to run without it. `cargo check` never bundles,
        # so an empty placeholder is enough here.
        run: New-Item -ItemType File -Path desktop/yt-dlp.exe -Force
      - name: stage web UI
        # frontendDist points at desktop/dist, which is generated, not committed.
        run: node stage-ui.cjs
      - name: clippy (workspace, strict)
        # The workspace-wide strict lint lives here because the desktop crate
        # only builds on Windows.
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: check
        run: cargo check -p measured-desktop
      - name: test
        # safe_name is the guard that stops a user-supplied filename from
        # escaping the library directory, and its tests only build on Windows.
        # `cargo check` never links them, so before this step they had never
        # run in CI at all — the guard was covered on paper only.
        run: cargo test -p measured-desktop
