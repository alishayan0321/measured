[package]
name = "measured-desktop"
version = "2.0.2"
edition = "2021"
description = "MEASURED - a local music player that cannot phone home"
authors = ["MEASURED"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
measured-core = { path = "../core" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
# OS media controls: Windows SMTC, macOS Now Playing, Linux MPRIS.
souvlaki = "0.9"
# Needed to pull the HWND out of the Tauri window for SMTC.
raw-window-handle = "0.6"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
