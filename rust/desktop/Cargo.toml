[package]
name = "measured-desktop"
version = "2.1.1"
edition = "2021"
description = "MEASURED - a local music player that cannot phone home"
authors = ["MEASURED"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
measured-core = { path = "../core" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
# A second launch must hand its argv to the running copy and exit instead of
# starting a rival process that would race this one on settings.json.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
# yt-dlp runs as a child process; tokio's process driver is what lets it be
# awaited with a deadline instead of blocking a thread for the whole download.
tokio = { version = "1", features = ["process", "time", "io-util"] }
# OS media controls: Windows SMTC, macOS Now Playing, Linux MPRIS.
souvlaki = "0.9"
# Needed to pull the HWND out of the Tauri window for SMTC.
raw-window-handle = "0.6"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
